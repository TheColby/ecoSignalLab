name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag
        required: true
        default: v0.3.0
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release tag
        run: |
          python - <<'PY'
          import os
          import re
          tag = os.environ['RELEASE_TAG']
          if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) is None:
              raise SystemExit('Expected a stable vMAJOR.MINOR.PATCH tag')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PACKAGE_VERSION={tag[1:]}\n')
          PY
      - name: Download published distributions
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > release.json
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern "ecosignallab-${PACKAGE_VERSION}-py3-none-any.whl" \
            --pattern "ecosignallab-${PACKAGE_VERSION}.tar.gz"
      - name: Verify release hashes and package identity
        run: python scripts/verify_pypi_release.py --tag "$RELEASE_TAG" --release-json release.json --dist dist
      - name: Validate PyPI metadata
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ecosignallab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - name: Publish verified release files
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

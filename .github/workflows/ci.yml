name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: esl
          POSTGRES_PASSWORD: esl_ci_only
          POSTGRES_DB: esl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ESL_TEST_POSTGRES_DSN: postgresql://esl:esl_ci_only@localhost:5432/esl_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,io,archive]
      - name: Lint
        run: ruff check .
      - name: Type check (scoped strict)
        run: |
          mypy --follow-imports=skip \
            src/esl/core/audio.py \
            src/esl/core/utils.py \
            src/esl/core/analyzer.py \
            src/esl/ml/export.py \
            src/esl/schema/spec.py \
            src/esl/cli/main.py \
            src/esl/__main__.py
      - name: Test suite
        run: pytest --cov=esl --cov-report=
      - name: Golden coverage floor
        run: |
          pytest -q tests/test_metrics_golden.py tests/test_ml_frametable.py --cov=esl --cov-append --cov-report=
          coverage report \
            --include='*/src/esl/core/analyzer.py,*/src/esl/metrics/builtin.py,*/src/esl/metrics/helpers.py,*/src/esl/ml/export.py' \
            --fail-under=70
      - name: Docs build (HTML)
        run: esl docs --root . --out docs/build --formats html
